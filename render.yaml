services:
  - type: web
    name: wer-wird-millionaer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'flet run main-DESKTOP-3SJ00FD.py --web --host 0.0.0.0 --port "$PORT"'
    envVars:
      - key: APP_NAME
        value: Wer wird Millionär
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TLS
        value: "true"
      - key: SMTP_SSL
        value: "false"
