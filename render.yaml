services:
  - type: web
    name: wer-wird-millionaer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'export FLET_SERVER_PORT="${PORT:-8000}"; export FLET_SERVER_IP=0.0.0.0; python main.py'
    envVars:
      - key: APP_NAME
        value: Wer wird Millionär
      - key: APP_BASE_URL
        value: https://wer-wird-million-r-eo5q.onrender.com
      - key: QUESTMAPPER_WEB_URL
        value: https://questmapper-web.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TLS
        value: "true"
      - key: SMTP_SSL
        value: "false"
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
  - type: web
    runtime: static
    name: questmapper-web
    buildCommand: cd web/questmapper && npm install && npm run build
    staticPublishPath: web/questmapper/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
