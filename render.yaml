services:
  - type: web
    name: wer-wird-millionaer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'flet run main-DESKTOP-3SJ00FD.py --web --host 0.0.0.0 --port "$PORT"'
    envVars:
      - key: APP_NAME
        value: Wer wird Millionär
      - key: QUESTMAPPER_WEB_URL
        value: https://questmapper-web.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TLS
        value: "true"
      - key: SMTP_SSL
        value: "false"
  - type: web
    runtime: static
    name: questmapper-web
    buildCommand: cd web/questmapper && npm install && npm run build
    staticPublishPath: web/questmapper/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
